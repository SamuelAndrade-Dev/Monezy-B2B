name: Mobile quality checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Validate Expo dependencies
        run: npm exec --workspace @monezy/front-end -- expo install --check
      - name: Compile Android JavaScript bundle
        working-directory: front-end
        run: npx expo export --platform android --output-dir /tmp/monezy-b2b-export
